<script>
  (() => {
    const torchBtn = document.getElementById('torchBtn');
    const torchIcon = document.getElementById('torchIcon');
    const torchStatusDot = document.getElementById('torchStatusDot');
    let isTorchActive = false;

    if (torchBtn && torchIcon && torchStatusDot) {
      torchBtn.addEventListener('click', () => {
        isTorchActive = !isTorchActive;
        if (isTorchActive) {
          torchIcon.classList.remove('text-on-surface');
          torchIcon.classList.add('text-primary-fixed');
          torchStatusDot.classList.remove('bg-outline-variant');
          torchStatusDot.classList.add('bg-primary-fixed');
          torchBtn.classList.add('shadow-[0_0_16px_rgba(197,243,49,0.35)]');
        } else {
          torchIcon.classList.remove('text-primary-fixed');
          torchIcon.classList.add('text-on-surface');
          torchStatusDot.classList.remove('bg-primary-fixed');
          torchStatusDot.classList.add('bg-outline-variant');
          torchBtn.classList.remove('shadow-[0_0_16px_rgba(197,243,49,0.35)]');
        }
      });
    }

    const galleryBtn = document.getElementById('galleryPickBtn');
    if (galleryBtn) {
      galleryBtn.addEventListener('click', () => {
        galleryBtn.classList.add('bg-surface-container-highest');
        setTimeout(() => galleryBtn.classList.remove('bg-surface-container-highest'), 180);
      });
    }
  })();
